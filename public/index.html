<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Smart Waste Management System - report waste problems, track collection and help build a cleaner community." />
  <meta name="theme-color" content="#047857" />
  <title>Smart Waste Management System</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BD%3C/text%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Loaded non-blocking so the app renders instantly even offline -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        media="print" onload="this.media='all'" />

  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <!-- Application root: everything (router output) is rendered here -->
  <div id="app">
    <div class="boot-screen" role="status">
      <div class="boot-logo">♻️</div>
      <div class="boot-spinner"></div>
      <p>Loading Smart Waste Management System…</p>
    </div>
  </div>

  <!-- Toast notifications + modal layer -->
  <div id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Vendored libraries (no CDN needed at runtime) -->
  <script src="/vendor/chartjs/chart.umd.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
